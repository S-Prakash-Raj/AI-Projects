[project]
name = "appconfig"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prakash Raj", email = "prakashrajml3@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
appconfig = "appconfig:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]
