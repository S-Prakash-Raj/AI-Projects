[project]
name = "logstat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prakash Raj", email = "prakashrajml3@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.29.1",
]

[project.scripts]
logstat = "logstat.cli:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
files = ["src", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]
